services:
  app:
    build: .
    ports:
      - "8081:8081"

    networks:
      - s-networks

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/DockerDB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 0000

  mysql:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: 0000
      MYSQL_DATABASE: DockerDB
    ports:
      - "3307:3306"

    networks:
      - s-networks

    volumes:
      - mysql-s-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
      start_period: 20s

networks:
  s-networks:
    driver: bridge

volumes:
  mysql-s-data:
